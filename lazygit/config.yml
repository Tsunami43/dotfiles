# ~/.config/lazygit/config.yml
os:
  # Open files in the parent nvim instance via $NVIM when lazygit
  # runs inside a nvim terminal; falls back to plain nvim otherwise.
  # nvim-edit.sh opens the file in the parent nvim instance (via
  # LazyGitEditFromFloat in ~/.config/nvim/plugins/lazygit.lua) or in a
  # plain nvim outside of it. A POSIX script is used because lazygit
  # runs commands through $SHELL, which is fish here.
  editPreset: "nvim-remote"
  edit: '~/.config/lazygit/nvim-edit.sh {{filename}}'
  editAtLine: '~/.config/lazygit/nvim-edit.sh {{filename}} {{line}}'

gui:
  nerdFontsVersion: "3" # or "2"
  showFileIcons: true
  # Cendre · hard, from ~/Projects/me/cendre/extras/lazygit/cendre.yml.
  # Regenerate there rather than hand-editing these values.
  theme:
    activeBorderColor:
      - "#ea9875"
      - "bold"
    inactiveBorderColor:
      - "#73665b"
    searchingActiveBorderColor:
      - "#fcba81"
      - "bold"
    optionsTextColor:
      - "#ea9875"
    selectedLineBgColor:
      - "#2a2422"
    inactiveViewSelectedLineBgColor:
      - "#201b19"
    cherryPickedCommitFgColor:
      - "#171311"
    cherryPickedCommitBgColor:
      - "#ea9875"
    markedBaseCommitFgColor:
      - "#171311"
    markedBaseCommitBgColor:
      - "#fcba81"
    unstagedChangesColor:
      - "#d25780"
    defaultFgColor:
      - "#e6d5c2"

keybinding:
  universal:
    edit: "o"
    openFile: "<disabled>"
