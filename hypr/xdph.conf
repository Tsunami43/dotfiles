screencopy {
    # Slack requests persist_mode=1, but the token is only issued when the
    # "Allow restore token" box is checked in the picker. Without a token xdph
    # logs "restore data invalid / missing, prompting" and pops the picker on
    # EVERY request — and Slack sends them in bursts (preview thumbnail + the
    # actual share), hence the endless screen-picker loop. With the box checked
    # by default the first request issues a token and the rest go through
    # "restore data valid, not prompting".
    allow_token_by_default = true
}
