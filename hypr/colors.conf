# Border colours — startup values only.
#
# Once the shell is up its HyprColors service pushes the active theme's palette
# over these with `hyprctl keyword`, and re-applies it after every config
# reload, so borders follow the theme live. Keep these matching the shell's
# default preset so nothing flashes in the moment before it loads.

$primary  = rgb(b3d0ea)
$outline  = rgb(39414f)
$error    = rgb(e06c75)

general {
  col.active_border   = $primary
  col.inactive_border = $outline
}

group {
  col.border_active   = $primary
  col.border_inactive = $outline
  col.border_locked_active   = $error
  col.border_locked_inactive = $outline

  groupbar {
    col.active         = $primary
    col.inactive       = $outline
    col.locked_active   = $error
    col.locked_inactive = $outline
  }
}
