# Generated by quickshell — Settings > Language & input.
# Rewritten in full whenever a keyboard setting changes there, so hand edits
# will not survive. Sourced from hyprland.conf, after the inline input block.
input {
    kb_layout = us,ru
    kb_variant = ,
    kb_options = custom:caps_group_nocaps
    numlock_by_default = true
}
