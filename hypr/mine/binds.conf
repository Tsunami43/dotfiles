unbind = SUPER, space
unbind = SUPER, N
unbind = SUPER ALT, L
unbind = , XF86AudioRaiseVolume
unbind = , XF86AudioLowerVolume
unbind = , XF86AudioMute
unbind = , XF86AudioMicMute
unbind = , XF86AudioPlay
unbind = , XF86AudioPause
unbind = , XF86AudioNext
unbind = , XF86AudioPrev
unbind = , Print
unbind = CTRL, Print

# === Shell UI ===
bind = SUPER, space, exec, qs -c mine ipc call launcher toggle
bind = SUPER, N, exec, qs -c mine ipc call sidebar toggle
bind = SUPER, C, exec, qs -c mine ipc call nexus toggle
bind = SUPER ALT, L, exec, qs -c mine ipc call lock lock

# === Audio (wpctl / wireplumber) ===
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 3%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 3%-
bindl  = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# === Media (mpris via mine's IPC — playerctl not installed) ===
bindl = , XF86AudioPlay,  exec, qs -c mine ipc call media playpause
bindl = , XF86AudioPause, exec, qs -c mine ipc call media playpause
bindl = , XF86AudioNext,  exec, qs -c mine ipc call media next
bindl = , XF86AudioPrev,  exec, qs -c mine ipc call media previous

# === Screenshots (grim + slurp) ===
bind = , Print,      exec, sh -c 'mkdir -p ~/Pictures/Screenshots && grim -g "$(slurp)" - | tee ~/Pictures/Screenshots/$(date +%Y%m%d-%H%M%S).png | wl-copy'
bind = CTRL, Print,  exec, sh -c 'mkdir -p ~/Pictures/Screenshots && grim - | tee ~/Pictures/Screenshots/$(date +%Y%m%d-%H%M%S).png | wl-copy'
