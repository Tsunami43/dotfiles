# Border colours — startup values only.
#
# Once quickshell is up, services/HyprColors.qml pushes the active theme's palette over
# these with `hyprctl keyword`, and re-applies it after every config reload, so borders
# follow the shell's theme live. Keep these matching the default preset (Themes.qml ->
# hallownest) so nothing flashes in the moment before the shell loads.

$primary  = rgb(a8c5e0)
$outline  = rgb(39414f)
$error    = rgb(e06c75)

general {
  col.active_border   = $primary
  col.inactive_border = $outline
}

group {
  col.border_active   = $primary
  col.border_inactive = $outline
  col.border_locked_active   = $error
  col.border_locked_inactive = $outline

  groupbar {
    col.active         = $primary
    col.inactive       = $outline
    col.locked_active   = $error
    col.locked_inactive = $outline
  }
}
