# Hyprland Configuration
# https://wiki.hypr.land/Configuring/

# ==================
# MONITOR CONFIG
# ==================
# Monitors from existing configuration
# monitor = eDP-2, 2560x1600@239.998993, 2560x0, 1, vrr, 1
monitor = , preferred,auto,auto

monitor = , preferred,auto,auto

# ==================
# ENVIRONMENT
# ==================
env = XDG_CURRENT_DESKTOP,Hyprland
env = QT_QPA_PLATFORMTHEME,qt6ct

# ==================
# STARTUP APPS
# ==================
exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user import-environment XDG_CURRENT_DESKTOP WAYLAND_DISPLAY
exec-once = systemctl --user start hyprland-session.target
exec-once = udiskie --notify   # auto-mount removable drives + notify in the bar
# Bake the shell's shaders (.frag -> .qsb, which is all ShaderEffect can load) before it
# starts; the .qsb files are build output and are not kept in the repo.
exec-once = sh -c '$HOME/.config/quickshell/mine/assets/build-shaders.sh; exec qs -c mine'

# ==================
# INPUT CONFIG
# ==================
input {
    kb_layout = us,ru
    # Caps switches the layout; Caps Lock itself is disabled, including
    # Shift+Caps. Defined in ~/.config/xkb/symbols/custom (grp:caps_toggle
    # keeps Shift+Caps as a real Caps Lock, which is not wanted).
    kb_options = custom:caps_group_nocaps
    numlock_by_default = true
}

# ==================
# GENERAL LAYOUT
# ==================
general {
    gaps_in = 15
    gaps_out = 15
    border_size = 1

    layout = dwindle
}

# ==================
# DECORATION
# ==================
decoration {
    rounding = 14

    active_opacity = 1.0
    inactive_opacity = 1.0

    # Compositor-side blur for transparent windows (ghostty bg is 0.85).
    # brightness/vibrancy lowered so what shows through stays dark, not washed out.
    blur {
        enabled = true
        size = 5
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        brightness = 0.65
        vibrancy = 0.1
        vibrancy_darkness = 0.4
    }

    # Colour comes from the shell (services/HyprColors.qml keys it off the active theme);
    # geometry lives here. Lower render_power = the falloff stretches further out.
    shadow {
        enabled = true
        range = 45
        render_power = 3
        offset = 0 8
        color = rgba(00000070)
    }
}

# ==================
# ANIMATIONS
# ==================
animations {
    enabled = true

    animation = windowsIn, 1, 3, default
    animation = windowsOut, 1, 3, default
    animation = workspaces, 1, 5, default
    animation = windowsMove, 1, 4, default
    animation = fade, 1, 3, default
    animation = border, 1, 3, default
}

# ==================
# LAYOUTS
# ==================
dwindle {
    preserve_split = true
}

master {
    mfact = 0.5
}

# ==================
# MISC
# ==================
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true   # clicking a notification (app requests activation) focuses + switches to it
}

# ==================
# WINDOW RULES
# ==================
windowrule = tile on, match:class ^(org\.wezfurlong\.wezterm)$

windowrule = rounding 12, match:class ^(org\.gnome\.)

windowrule = tile on, match:class ^(gnome-control-center)$
windowrule = tile on, match:class ^(pavucontrol)$
windowrule = tile on, match:class ^(nm-connection-editor)$

windowrule = float on, match:class ^(org\.gnome\.Calculator)$
windowrule = float on, match:class ^(gnome-calculator)$
windowrule = float on, match:class ^(galculator)$
windowrule = float on, match:class ^(blueman-manager)$
windowrule = float on, match:class ^(org\.gnome\.Nautilus)$
windowrule = float on, match:class ^(xdg-desktop-portal)$

windowrule = no_initial_focus on, match:class ^(steam)$, match:title ^(notificationtoasts)
windowrule = pin on, match:class ^(steam)$, match:title ^(notificationtoasts)

windowrule = float on, match:class ^(firefox)$, match:title ^(Picture-in-Picture)$
windowrule = float on, match:class ^(zoom)$

# Translucent chat apps so the blur shows through (active inactive opacity)
windowrule = opacity 0.86 0.80, match:class ^(org\.telegram\.desktop)$
# Class depends on the backend: 'slack' on native Wayland, 'Slack' on XWayland
windowrule = opacity 0.86 0.80, match:class ^([Ss]lack)$
windowrule = opacity 0.86 0.80, match:class ^(discord)$
# Firefox kept a touch more opaque — web pages stay readable
windowrule = opacity 0.92 0.86, match:class ^(firefox)$

# Floating lazygit (size handled here, not in spawn dispatch — inline size% is unreliable)
windowrule = float on, match:class ^(com\.mitchellh\.ghostty\.lazygit)$
windowrule = size 1800 1100, match:class ^(com\.mitchellh\.ghostty\.lazygit)$
windowrule = center on, match:class ^(com\.mitchellh\.ghostty\.lazygit)$

# Shell windows floating by default
# ! Hyprland doesn't size these windows correctly so disabling by default here
# windowrule = float on, match:class ^(org.quickshell)$

layerrule = no_anim on, match:namespace ^(quickshell)$
source = ./mine/colors.conf
source = ./mine/binds.conf

# File manager: yazi in ghostty
bind = SUPER, E, exec, ghostty -e yazi

# Floating lazygit in cwd of focused ghostty (handles tmux active-pane)
# bind = SUPER, G, exec, $HOME/.config/hypr/scripts/float-lazygit.sh
