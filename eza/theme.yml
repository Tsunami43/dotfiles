# cendre · hard — the icon and name colours eza prints.
#
# eza carries its own icon palette (the Nerd Fonts brand colours) plus a short
# list of built-in file types, and neither is reachable from the terminal
# theme: directories and half the extension table come out on a cold blue this
# palette does not contain. Everything below re-cuts those glyphs onto the same
# roles ~/.config/yazi/theme.toml and ~/.config/nvim/plugins/devicons.lua use,
# so "source" or "archive" looks the same in the shell, the file manager and
# the editor.
#
# An extension rule colours the icon and the name in one go, which is why each
# role carries both keys. The `roles` block at the top is not an eza key — it
# exists so the anchors have somewhere to live; eza ignores what it cannot
# name. Generated by scratchpad/recolor.py alongside the yazi block.

roles:
  dir: &dir
    filename: { foreground: "#ea9875" }
    icon: { style: { foreground: "#ea9875" } }
  code: &code
    filename: { foreground: "#99af6b" }
    icon: { style: { foreground: "#99af6b" } }
  doc: &doc
    filename: { foreground: "#4e89a2" }
    icon: { style: { foreground: "#4e89a2" } }
  data: &data
    filename: { foreground: "#fcba81" }
    icon: { style: { foreground: "#fcba81" } }
  media: &media
    filename: { foreground: "#9480ba" }
    icon: { style: { foreground: "#9480ba" } }
  archive: &archive
    filename: { foreground: "#d1766e" }
    icon: { style: { foreground: "#d1766e" } }
  crypto: &crypto
    filename: { foreground: "#f4a21c" }
    icon: { style: { foreground: "#f4a21c" } }
  noise: &noise
    filename: { foreground: "#73665b" }
    icon: { style: { foreground: "#73665b" } }
  plain: &plain
    filename: { foreground: "#a09384" }
    icon: { style: { foreground: "#a09384" } }

# File kinds eza knows without looking at the name.
filekinds:
  directory: { foreground: "#ea9875" }
  executable: { foreground: "#99af6b" }
  symlink: { foreground: "#4e89a2" }
  socket: { foreground: "#4e89a2" }
  special: { foreground: "#20c9cb" }
  block_device: { foreground: "#fcba81" }
  char_device: { foreground: "#fcba81" }
  mount_point: { foreground: "#9480ba" }

# The quiet columns: a readout is not an accent.
date: { foreground: "#73665b" }
inode: { foreground: "#73665b" }
blocks: { foreground: "#73665b" }
octal: { foreground: "#a09384" }
flags: { foreground: "#73665b" }
header: { foreground: "#a09384" }
punctuation: { foreground: "#73665b" }
symlink_path: { foreground: "#4e89a2" }
control_char: { foreground: "#d25780" }
broken_symlink: { foreground: "#d25780" }
broken_path_overlay: { foreground: "#d25780" }
security_context: { colon: { foreground: "#73665b" } }
size:
  major: { foreground: "#a09384" }
  number_byte: { foreground: "#a09384" }
  number_kilo: { foreground: "#a09384" }
  number_mega: { foreground: "#a09384" }
  number_giga: { foreground: "#a09384" }
  number_huge: { foreground: "#a09384" }
  minor: { foreground: "#73665b" }
  unit_byte: { foreground: "#73665b" }
  unit_kilo: { foreground: "#73665b" }
  unit_mega: { foreground: "#73665b" }
  unit_giga: { foreground: "#73665b" }
  unit_huge: { foreground: "#73665b" }
users:
  user_root: { foreground: "#d1766e" }
  user_other: { foreground: "#a09384" }
  group_yours: { foreground: "#a09384" }
  group_other: { foreground: "#73665b" }
  group_root: { foreground: "#d1766e" }
links:
  normal: { foreground: "#a09384" }
  multi_link_file: { foreground: "#f4a21c" }

# Permission bits, following cendre's own eza extra: readable is
# brass, writable is the colour of something you can break, and the
# execute bit is the one that means "this runs".
perms:
  user_read: { foreground: "#fcba81" }
  group_read: { foreground: "#fcba81" }
  other_read: { foreground: "#fcba81" }
  attribute: { foreground: "#fcba81" }
  user_write: { foreground: "#d25780" }
  group_write: { foreground: "#d25780" }
  other_write: { foreground: "#d25780" }
  user_execute_file: { foreground: "#99af6b" }
  user_execute_other: { foreground: "#99af6b" }
  group_execute: { foreground: "#99af6b" }
  other_execute: { foreground: "#99af6b" }
  special_user_file: { foreground: "#d1766e" }
  special_other: { foreground: "#d1766e" }

# Worktree state, matching the tmux bar and the starship prompt.
git:
  new: { foreground: "#99af6b" }
  modified: { foreground: "#f4a21c" }
  deleted: { foreground: "#d25780" }
  renamed: { foreground: "#4e89a2" }
  typechange: { foreground: "#9480ba" }
  ignored: { foreground: "#73665b" }
  conflicted: { foreground: "#d25780" }
git_repo:
  branch_main: { foreground: "#a09384" }
  branch_other: { foreground: "#4e89a2" }
  git_clean: { foreground: "#99af6b" }
  git_dirty: { foreground: "#f4a21c" }

