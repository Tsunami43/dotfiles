"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
# Managed by desktop-theme.py — Ember — warm GitHub (white / orange / coral) (transparent, fg-only)

format = """
$directory$git_branch$git_status$nodejs$rust$golang$php$python$time
$character"""

[directory]
style = "fg:#ff8c7a bold"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
format = '[$symbol $branch ](fg:#e3b341)'

[git_status]
format = '[$all_status$ahead_behind ](fg:#ff7b72)'

[nodejs]
symbol = ""
format = '[$symbol ($version) ](fg:#ffb3a3)'
[rust]
symbol = ""
format = '[$symbol ($version) ](fg:#ffb3a3)'
[golang]
symbol = ""
format = '[$symbol ($version) ](fg:#ffb3a3)'
[php]
symbol = ""
format = '[$symbol ($version) ](fg:#ffb3a3)'
[python]
symbol = ""
format = '[$symbol ($version) ](fg:#ffb3a3)'

[time]
disabled = false
time_format = "%T"
format = '[ $time ](fg:#8b949e)'

[character]
success_symbol = "[❯](bold fg:#ff8c7a)"
error_symbol = "[❯](bold fg:#ff7b72)"
vimcmd_symbol = "[❮](bold fg:#e3b341)"
