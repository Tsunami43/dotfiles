set -ag terminal-overrides ",xterm-256color:RGB"
set -g default-terminal "tmux-256color"

set -g mouse on
set -g renumber-windows on          # renumber all windows when any window is closed
set -g set-clipboard on             # use system clipboard
set -g escape-time 0                # zero-out escape time delay
set -g base-index 1                 # start indexing windows at 1 instead of 0
set -g history-limit 100000          # increase scrollback history
set-window-option -g mode-keys vi   # Set Vi Mode

## Bindings 

# Window Management
# Default new-window starts in the session's directory; inherit the active pane's instead.
bind c new-window -c "#{pane_current_path}"       # Open current path
bind v split-window -h -c "#{pane_current_path}"  # Open current path
bind V split-window -v -c "#{pane_current_path}"  # Open current path

# Reload
unbind r
bind r source-file ~/.config/tmux/tmux.conf       # Refresh config

# Set Prefix
# unbind C-b
# set -g prefix C-Space                             # bind control-space as prefix

# Vi mode bindings
bind-key t copy-mode                                  # Enter vi copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Resizing windows
bind j resize-pane -D 5                       # Move Pane down
bind k resize-pane -U 5                       # Move Pane up
bind l resize-pane -R 5                       # Move Pane right
bind h resize-pane -L 5                       # Move Pane left
bind m resize-pane -Z                         # Maximize current pane

# Navigate panes (no prefix)
bind -n C-h select-pane -L -Z
bind -n C-j select-pane -D -Z
bind -n C-k select-pane -U -Z
bind -n C-l select-pane -R -Z

# Move pane position
bind H swap-pane -s '{left-of}'                  # Move pane left
bind J swap-pane -s '{down-of}'                  # Move pane down
bind K swap-pane -s '{up-of}'                    # Move pane up
bind L swap-pane -s '{right-of}'                 # Move pane right

# Pane Management
bind-key q kill-pane


# Clear history
bind-key -n C-S-k send-keys -R \; clear-history

# Plugins
set -g @plugin 'tmux-plugins/tpm'
# tmux-pain-control disabled - overrides custom h/j/k/l and H/J/K/L bindings
# set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'christoomey/vim-tmux-navigator'  # Disabled - conflicts with custom C-hjkl bindings
set -g @plugin 'tmux-plugins/tmux-yank'          # yank support for tmux

# Cendre · hard — palette from ~/Projects/me/cendre (lua/cendre/palette.lua).
# Named by role rather than by hue, so a change there maps onto one name here.
c_bg_deep="#0f0c0a"   # popups, one layer below the editor
c_bg0="#171311"       # ink on top of a filled block
c_bg2="#2a2422"       # the bar's own ground
c_bg3="#362f2c"       # inactive pane borders
c_bg4="#463e3a"       # current window, and messages
c_fg="#e6d5c2"
c_fg_dim="#a09384"    # current window index
c_comment="#73665b"   # inactive windows, clean worktree
c_gutter="#4e4641"    # the quietest ink there is — inactive window indices
c_ember="#ea9875"     # the UI accent: session block, active border
c_brass="#fcba81"     # prefix held
c_warn="#f4a21c"      # dirty worktree
c_info="#58bdff"      # copy mode
c_vis="#2f1e17"       # selection tint

# The bar stands on bg2, one layer above the buffer. Cells carrying an explicit
# background are drawn opaque by the terminal, so the bar reads as a solid band
# while the window behind it stays translucent and the blur keeps showing.
set -g status-style "bg=$c_bg2,fg=$c_fg"
set -g status-left-style "bg=$c_bg2,fg=$c_fg"
set -g status-right-style "bg=$c_bg2,fg=$c_comment"

# Windows separate by weight of ink, not by fills: the session block is the only
# accent in the bar, and the current window lifts on a shift of ground instead.
set -g window-status-style "bg=$c_bg2,fg=$c_comment"
set -g window-status-current-style "bg=$c_bg4,fg=$c_fg,bold"
set -g window-status-activity-style "bg=$c_bg2,fg=$c_warn"
set -g window-status-bell-style "bg=$c_bg2,fg=$c_warn"

# Borders keep bg=default so the empty border row under the bar stays
# transparent and reads as a hairline rather than as a second band.
set -g pane-border-style "fg=$c_bg3,bg=default"
set -g pane-active-border-style "fg=$c_ember,bg=default"

# Messages lift on a ground shift too — an accent fill here would compete with
# the session block for the one accent the bar is allowed.
set -g message-style "bg=$c_bg4,fg=$c_fg"
set -g message-command-style "bg=$c_bg4,fg=$c_brass"

# Copy mode reuses the theme's selection tint, the same one nvim draws Visual in
set -g mode-style "bg=$c_vis,fg=$c_fg"

# Status bar configuration
set -g status-position top
set -g status-left-length 100
# The right region now spans from the centre column to the edge, so its budget
# has to cover half a wide terminal, not just the git segment.
set -g status-right-length 400

# ◆ marks a session pinned in the session popup (its @pinned option). The ☰ that
# used to open that popup is gone: pinning the clock costs the bar its click
# targets, so a button nothing can press would only be a lie. prefix + s still
# opens it. The prefix itself is reported in the centre slot, not here.
set -g status-left "#[bg=$c_ember,fg=$c_bg0,bold] #{?@pinned,◆ ,}#S #[bg=$c_bg2,fg=$c_fg,nobold] "

# The clock is held on the bar's centre column, and it is the right region that
# holds it there. tmux right-aligns this whole string, so its width decides where
# it begins: status.sh is told the client width and emits exactly enough leading
# space for the region to start at the centre. Nothing on the left can push it,
# because nothing on the left is measured.
#
# The first field is a state slot, eight columns wide whichever state it shows —
# prefix, then copy mode, then the time — so the geometry never shifts.
#
# One #() for the whole region, not one per readout: tmux runs each of these in
# its own shell, and starting that shell costs an order of magnitude more than
# anything the segments compute. status.sh sources them instead. See its header.
set -g status-right "#{?client_prefix,#[fg=$c_brass bold] SUPER  #[nobold],#{?pane_in_mode,#[fg=$c_info]  COPY  ,#[fg=$c_fg]%H:%M:%S}}#(~/.config/tmux/status.sh \"#{pane_current_path}\" #{client_width})"

# Window status format — the command is the label, the index trails it quietly
set -g window-status-format " #{pane_current_command}#{?window_zoomed_flag, ,} #[fg=$c_gutter]#I "
set -g window-status-current-format " #{pane_current_command}#{?window_zoomed_flag, ,} #[fg=$c_fg_dim]#I "

# No rule between the bar and the work area. The hairline was there to separate
# a transparent bar from the buffer; now that the bar carries its own ground,
# the edge of that ground is the separation, and a line under it reads as a seam.
set -g pane-border-status off
set -g pane-border-lines single

# Initializes the TMUX plugin manager
run '~/.config/tmux/plugins/tpm/tpm'

# tmux-sensible and friends reset the bar's own styling, so the ground is
# restated here rather than above -> place after run
set -g status-style "bg=$c_bg2,fg=$c_fg"

# The clock shows seconds, so the bar has to redraw every second. tmux-sensible
# sets this to 5, hence restating it here rather than above. status.sh absorbs
# the extra calls with its cache — the real git work still runs at the old rate,
# and the CPU sample only closes its window every two seconds.
set -g status-interval 1


# ────────────────────────────────
# New session bind — tmux picks the next free number
# ────────────────────────────────
bind-key n new-session

# Import external configs
source ~/.config/tmux/utility.conf

# ────────────────────────────────
# Session lifetime
# ────────────────────────────────
# Closing the terminal only detaches the client, leaving the session behind.
# An unpinned session is throwaway, so it goes with the window it was used in;
# a pinned one (◆, set from the session popup) is kept for the next attach.
# The session is only dropped once its last client is gone.
set-hook -g client-detached 'if-shell -F "#{&&:#{!=:#{@pinned},1},#{==:#{session_attached},0}}" kill-session'
# ────────────────────────────────
