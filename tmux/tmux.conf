# ── terminal ───────────────────────────────────────────────────
set -ag terminal-overrides ",xterm-256color:RGB"
set -g default-terminal "tmux-256color"

set -g mouse on
set -g renumber-windows on        # keep window numbers contiguous after a close
set -g set-clipboard on
set -g escape-time 0              # Escape is a key here, not the head of a sequence
set -g base-index 1
set -g history-limit 100000
set-window-option -g mode-keys vi

# ── keys ───────────────────────────────────────────────────────
#
# Alt is the modifier, not a prefix. A prefix is a sequence — press, release,
# press again; a modifier is held. tmux cannot be told to hold one, but it can
# bind one: every binding here is -n, so no prefix precedes it and Alt is just
# part of the chord.
#
# The cost is that these combinations stop reaching whatever runs inside the
# pane — fish loses Alt+h and Alt+l among them — so the list is kept short.
# C-b remains tmux's prefix with its default bindings, unclaimed by anything
# below, as a way back in if a chord is ever swallowed upstream.

# Windows. New ones inherit the active pane's directory rather than the
# session's, which is almost always the one meant.
bind -n M-c new-window -c "#{pane_current_path}"
bind -n M-v split-window -h -c "#{pane_current_path}"
bind -n M-V split-window -v -c "#{pane_current_path}"
bind -n M-n new-session
bind -n M-q kill-pane

# BTab is what a terminal's Shift-Tab (CSI Z) arrives as.
bind -n M-Tab next-window
bind -n M-BTab previous-window

# base-index is 1, so 1-9 cover the list as it is actually numbered.
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9

# Panes. Moving between them and moving them are both single chords: one action
# each, done once, where a mode would be a door held open for a single step.
bind -n M-h select-pane -L -Z
bind -n M-j select-pane -D -Z
bind -n M-k select-pane -U -Z
bind -n M-l select-pane -R -Z

bind -n C-h select-pane -L -Z     # the same moves under Ctrl, from before Alt
bind -n C-j select-pane -D -Z
bind -n C-k select-pane -U -Z
bind -n C-l select-pane -R -Z

bind -n M-H swap-pane -s '{left-of}'
bind -n M-J swap-pane -s '{down-of}'
bind -n M-K swap-pane -s '{up-of}'
bind -n M-L swap-pane -s '{right-of}'

bind -n M-z resize-pane -Z        # a toggle, so a chord: Alt+z out, Alt+z back

bind -n M-r source-file ~/.config/tmux/tmux.conf
bind -n C-S-k send-keys -R \; clear-history

# ── resize mode ────────────────────────────────────────────────
#
# The one thing here that is a mode rather than a chord: a size is arrived at
# over several steps, and one chord per step is the wrong unit of work. Alt+m
# opens it, hjkl move the border unmodified from there.
#
# Every binding re-arms the table, since tmux drops back to root after a single
# key otherwise. The bar reads #{client_key_table} to name the state.
bind -n M-m switch-client -T resize

bind -T resize h resize-pane -L 5 \; switch-client -T resize
bind -T resize j resize-pane -D 5 \; switch-client -T resize
bind -T resize k resize-pane -U 5 \; switch-client -T resize
bind -T resize l resize-pane -R 5 \; switch-client -T resize
bind -T resize z resize-pane -Z \; switch-client -T resize
bind -T resize Escape switch-client -T root
bind -T resize q switch-client -T root

# ── copy mode ──────────────────────────────────────────────────
bind -n M-t copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ── palette ────────────────────────────────────────────────────
#
# Cendre · hard — https://github.com/Aejkatappaja/cendre. Named by role rather
# than by hue, so a change upstream maps onto one name here.
c_bg_deep="#0f0c0a"   # popups, one layer below the editor
c_bg0="#171311"       # ink on top of a filled block
c_bg2="#2a2422"       # the bar's own ground
c_bg3="#362f2c"       # inactive pane borders
c_bg4="#463e3a"       # current window, and messages
c_fg="#e6d5c2"
c_fg_dim="#a09384"    # current window index
c_comment="#73665b"   # inactive windows, clean worktree
c_gutter="#4e4641"    # the quietest ink there is — inactive window indices
c_ember="#ea9875"     # the UI accent: session block, active border
c_brass="#fcba81"     # prefix held
c_warn="#f4a21c"      # dirty worktree
c_info="#58bdff"      # copy mode
c_ok="#43b16a"        # the git overlay
c_vis="#2f1e17"       # selection tint

# ── styling ────────────────────────────────────────────────────

# The bar stands on bg2, one layer above the buffer. Cells carrying an explicit
# background are drawn opaque by the terminal, so the bar reads as a solid band
# while the window behind it stays translucent.
set -g status-style "bg=$c_bg2,fg=$c_fg"
set -g status-left-style "bg=$c_bg2,fg=$c_fg"
set -g status-right-style "bg=$c_bg2,fg=$c_comment"

# Windows separate by weight of ink, not by fills: the session block is the
# bar's only accent, and the current window lifts on a shift of ground instead.
set -g window-status-style "bg=$c_bg2,fg=$c_comment"
set -g window-status-current-style "bg=$c_bg4,fg=$c_fg,bold"
set -g window-status-activity-style "bg=$c_bg2,fg=$c_warn"
set -g window-status-bell-style "bg=$c_bg2,fg=$c_warn"

# bg=default keeps the empty border row under the bar transparent, so it reads
# as a hairline rather than as a second band.
set -g pane-border-style "fg=$c_bg3,bg=default"
set -g pane-active-border-style "fg=$c_ember,bg=default"
set -g pane-border-status off
set -g pane-border-lines single

# Messages lift on a ground shift too — an accent fill here would compete with
# the session block for the one accent the bar is allowed.
set -g message-style "bg=$c_bg4,fg=$c_fg"
set -g message-command-style "bg=$c_bg4,fg=$c_brass"

set -g mode-style "bg=$c_vis,fg=$c_fg"   # the tint nvim draws Visual in

# ── status bar ─────────────────────────────────────────────────
set -g status-position top
set -g status-left-length 100
set -g status-right-length 400    # the right region spans from the centre out

# The glyph is a mark, not a readout: it never changes, so the block is
# recognisable as the session block before the name is read. Prefix state is
# not its job — the right region says PREFIX in words.
set -g status-left "#[bg=$c_ember,fg=$c_bg0,bold]  #S #[bg=$c_bg2,fg=$c_fg,nobold] "

# The clock is held on the bar's centre column, and it is the right region that
# holds it there: tmux right-aligns this whole string, so its width decides
# where it begins. status.sh is told the client width and emits exactly enough
# leading space. Nothing on the left is measured, so nothing there can push it.
#
# The mode slot at the far end is ten columns in every state, so the readouts
# beside it never shift; layout.sh subtracts the same ten. Ten because SESSIONS
# is eight letters on its own.
#
# READY, not NORMAL: this bar sits directly above an editor that uses NORMAL for
# something else, and the same word an inch apart would mean two modes.
#
# Order matters. Overlays come first, being in front of everything including the
# key table underneath them. resize is tested before client_prefix deliberately —
# tmux raises client_prefix for any key table that is not root, so resize sets
# both flags and a prefix-first test would report every resize as a prefix.
#
# @overlay is claimed by the popups themselves (see utility.conf); tmux has no
# format for "a popup is open".
#
# One #() for the whole region, not one per readout: tmux runs each in its own
# shell, and starting that shell costs far more than anything the segments
# compute. status.sh sources them instead — see its header.
set -g status-right "#[fg=$c_fg]%H:%M:%S#(~/.config/tmux/status.sh \"#{pane_current_path}\" #{client_width})#{?#{==:#{@overlay},sessions},#[fg=$c_ember bold] SESSIONS #[nobold],#{?#{==:#{@overlay},git},#[fg=$c_ok bold]   GIT    #[nobold],#{?pane_in_mode,#[fg=$c_info]   COPY   ,#{?#{==:#{client_key_table},resize},#[fg=$c_ember bold]  RESIZE  #[nobold],#{?client_prefix,#[fg=$c_brass bold]  PREFIX  #[nobold],#[fg=$c_gutter]  READY   }}}}}"

# The command is the label; the index trails it quietly.
set -g window-status-format " #{pane_current_command}#{?window_zoomed_flag, ,} #[fg=$c_gutter]#I "
set -g window-status-current-format " #{pane_current_command}#{?window_zoomed_flag, ,} #[fg=$c_fg_dim]#I "

# ── plugins ────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
run '~/.config/tmux/plugins/tpm/tpm'

# Both of these are set above and reset by tmux-sensible, so they are restated
# after the run. The clock shows seconds, hence a one-second interval rather
# than sensible's five; status.sh absorbs the extra calls with its cache.
set -g status-style "bg=$c_bg2,fg=$c_fg"
set -g status-interval 1

# Sessions outlive the terminals they were opened in. Closing a window detaches
# the client and nothing more; a session ends only on purpose, from the session
# popup or kill-session.
set -g destroy-unattached off

source ~/.config/tmux/utility.conf
