set -ag terminal-overrides ",xterm-256color:RGB"
set -g default-terminal "tmux-256color"

set -g mouse on
set -g renumber-windows on          # renumber all windows when any window is closed
set -g set-clipboard on             # use system clipboard
set -g escape-time 0                # zero-out escape time delay
set -g base-index 1                 # start indexing windows at 1 instead of 0
set -g history-limit 100000          # increase scrollback history
set-window-option -g mode-keys vi   # Set Vi Mode

## Bindings 

# Window Management
bind v split-window -h -c "#{pane_current_path}"  # Open current path
bind V split-window -v -c "#{pane_current_path}"  # Open current path

# Reload
unbind r
bind r source-file ~/.config/tmux/tmux.conf       # Refresh config

# Set Prefix
# unbind C-b
# set -g prefix C-Space                             # bind control-space as prefix

# Vi mode bindings
bind-key t copy-mode                                  # Enter vi copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Resizing windows
bind j resize-pane -D 5                       # Move Pane down
bind k resize-pane -U 5                       # Move Pane up
bind l resize-pane -R 5                       # Move Pane right
bind h resize-pane -L 5                       # Move Pane left
bind m resize-pane -Z                         # Maximize current pane

# Navigate panes (no prefix)
bind -n C-h select-pane -L -Z
bind -n C-j select-pane -D -Z
bind -n C-k select-pane -U -Z
bind -n C-l select-pane -R -Z

# Move pane position
bind H swap-pane -s '{left-of}'                  # Move pane left
bind J swap-pane -s '{down-of}'                  # Move pane down
bind K swap-pane -s '{up-of}'                    # Move pane up
bind L swap-pane -s '{right-of}'                 # Move pane right

# Pane Management
bind-key q kill-pane


# Clear history
bind-key -n C-S-k send-keys -R \; clear-history

# Plugins
set -g @plugin 'tmux-plugins/tpm'
# tmux-pain-control disabled - overrides custom h/j/k/l and H/J/K/L bindings
# set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'christoomey/vim-tmux-navigator'  # Disabled - conflicts with custom C-hjkl bindings
set -g @plugin 'tmux-plugins/tmux-yank'          # yank support for tmux

# GitHub Dark with warm accents (matches ghostty/nvim/btop)
color_bg="#0d1117"
color_bg_alt="#161b22"
color_fg="#f0f6fc"
color_accent="#ff8c7a"
color_accent_bright="#ffb3a3"
color_grey="#8b949e"
color_border="#30363d"
color_red="#ff7b72"
color_yellow="#e3b341"
color_green="#3fb950"

# Apply theme — bar background is transparent (default) so the blur shows
set -g status-style "bg=default,fg=$color_fg"
set -g status-left-style "bg=default,fg=$color_accent"
set -g status-right-style "bg=default,fg=$color_accent"

# Window status colors
set -g window-status-style "bg=default,fg=$color_grey"
set -g window-status-current-style "bg=$color_accent,fg=$color_bg,bold"
set -g window-status-activity-style "bg=$color_red,fg=$color_bg"
set -g window-status-bell-style "bg=$color_yellow,fg=$color_bg"

# Pane border colors (bg matches status — empty border row blends into the bar)
set -g pane-border-style "fg=$color_border,bg=default"
set -g pane-active-border-style "fg=$color_accent,bg=default"

# Message colors
set -g message-style "bg=$color_accent,fg=$color_bg"
set -g message-command-style "bg=$color_accent_bright,fg=$color_bg"

# Copy mode colors
set -g mode-style "bg=$color_accent_bright,fg=$color_bg"

# Status bar configuration
set -g status-position top
set -g status-right-length 0
set -g status-left-length 100
set -g status-right ""
set -g status-left "#[fg=$color_bg,bg=$color_accent,bold] #S #[fg=$color_accent,bg=default] "

# Window status format
set -g window-status-format "#[fg=$color_grey,bg=default] #{pane_current_command}#{?window_zoomed_flag, (),} #[fg=$color_bg,bg=$color_grey] #I "
set -g window-status-current-format "#[fg=$color_fg,bg=default] #{pane_current_command}#{?window_zoomed_flag, (),} #[fg=$color_bg,bg=$color_accent,bold] #I "

# Separator line between status bar and work area
set -g pane-border-status top
set -g pane-border-format ""
set -g pane-border-lines single

# Initializes the TMUX plugin manager
run '~/.config/tmux/plugins/tpm/tpm'

# Make the status bar transparent -> place after run
set -g status-bg default
set -g status-style bg=default

# ────────────────────────────────
# New session bind
# ────────────────────────────────
bind-key n run-shell "~/.config/tmux/new_session.sh"

# Import external configs
source ~/.config/tmux/utility.conf

# Automatic session naming hook
set-hook -g session-created 'run-shell "sleep 0.1; \
SESSION_NAME=$(shuf -n1 ~/.config/tmux/session_names.txt); \
tmux rename-session -t 0 \"$SESSION_NAME\" "'
# ────────────────────────────────
