# Popups. cendre bg_deep is the ground the theme reserves for floats; an
# explicit bg also keeps them opaque over a translucent terminal window.
popup_style="bg=#0f0c0a,fg=#e6d5c2"
popup_border_style="bg=#0f0c0a,fg=#ea9875"

# Each popup names itself in @overlay while it is up, which is what the bar's
# mode slot reads. tmux has no format for "a popup is open" — an overlay leaves
# no trace in any flag a format can reach — so the popup has to say so.
#
# The flag is set inside the shell command, never around the display-popup:
# display-popup returns as soon as the popup is up, so anything sequenced after
# it would clear the flag while the popup was still on screen. sessions.sh
# claims and releases it under a trap; lazygit has no script of its own, so its
# release is spelled out below.

# lazygit, but only where there is a repository to look at — without the guard
# the popup opens on a git error and has to be dismissed by hand. The || read
# holds it open for failures worth seeing, like a broken lazygit config.
bind -n M-g if-shell 'git -C "#{pane_current_path}" rev-parse --is-inside-work-tree >/dev/null 2>&1' \
    "display-popup -d '#{pane_current_path}' -w 80% -h 80% \
        -s '$popup_style' -S '$popup_border_style' \
        -E 'tmux set -g @overlay git \; refresh-client -S; \
            lazygit -ucf ~/.config/lazygit/config.yml || read -n1; \
            tmux set -gu @overlay \; refresh-client -S'" \
    "display-message 'no repository here'"

# Session switcher. A popup rather than a real pane: a pane belongs to one
# window and would have to be dragged into every window the cursor visits.
#
# -y S puts its top edge under the status bar and -x C centres it, which is the
# column the clock is held on — so it drops out of the clock rather than landing
# over the middle of the work. Wider than tall: a tall column reads as a menu
# that has taken over, a short wide one as a drawer that pulled open.
bind -n M-s display-popup -x C -y S -w 56 -h 35% -b rounded -T ' sessions ' \
    -s "$popup_style" -S "$popup_border_style" \
    -E "~/.config/tmux/sessions.sh"
