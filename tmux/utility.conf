# Popup look — cendre bg_deep, the ground the theme reserves for floats. An
# explicit bg also keeps popups opaque over the terminal's transparent window.
popup_style="bg=#0f0c0a,fg=#e6d5c2"
popup_border_style="bg=#0f0c0a,fg=#ea9875"

# Display lazygit, but only where there is a repository to look at. Without the
# guard the popup opens on a git error and then has to be dismissed by hand.
# The || read holds the popup open for the failures that are worth seeing —
# a broken lazygit config, say — rather than for the ordinary "not a repo".
bind g if-shell 'git -C "#{pane_current_path}" rev-parse --is-inside-work-tree >/dev/null 2>&1' \
    "display-popup -d '#{pane_current_path}' -w 80% -h 80% \
        -s '$popup_style' -S '$popup_border_style' \
        -E 'lazygit -ucf ~/.config/lazygit/config.yml || read -n1'" \
    "display-message 'no repository here'"


# Session switcher popup (list, pin, rename, create, kill)
bind s display-popup -w 80% -h 80% -b rounded -T ' sessions ' \
    -s "$popup_style" -S "$popup_border_style" \
    -E "~/.config/tmux/sessions.sh"
