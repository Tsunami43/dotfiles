# Display lazygit
bind g display-popup -d '#{pane_current_path}' -w 80% -h 80% \
    -E "lazygit -ucf ~/.config/lazygit/config.yml || read -n1"


# Display opencode
# bind h display-popup -d '#{pane_current_path}' -w80% -h80% -E opencode

# Open Claude in new pane on the right with vim mode
bind a split-window -h -c '#{pane_current_path}' claude


# Session switcher popup (list, pin, rename, create, kill)
bind s display-popup -w 80% -h 80% -b rounded -S 'fg=#ff8c7a' -T ' sessions ' \
    -E "~/.config/tmux/sessions.sh"
