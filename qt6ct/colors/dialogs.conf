; Qt colour palette for every dialog on this desktop: the file chooser
; xdg-desktop-portal-lxqt draws for Firefox and Slack, and Telegram's own one.
; Generated once from #a78bfa (dark) with matugen; no generator is kept around.
;
; TWO THINGS MUST STAY TRUE or this file silently does nothing:
;  1. The portal has to read qt6ct. Its packaged unit pins QT_QPA_PLATFORMTHEME=lxqt, so a
;     drop-in at ~/.config/systemd/user/xdg-desktop-portal-lxqt.service.d/override.conf
;     points it back at qt6ct.
;  2. The Qt style has to honour a palette. Adwaita-Dark paints from its own hardcoded
;     colours and ignores this file entirely; Fusion renders it, so qt6ct.conf selects that.
;
; Qt reads the palette at startup — a running app keeps its old colours until restarted.
;
[ColorScheme]
active_colors=#e6e1e9, #211f24, #2b292f, #36343a, #141318, #48454e, #e6e1e9, #322f35, #e6e1e9, #141318, #141318, #000000, #cebdfe, #35275d, #cebdfe, #efb8c9, #1c1b20, #211f24, #e6e1e9, #322f35, #938f99
; Disabled: same surfaces, but every text role drops to the outline tone — that is the whole
; difference between "greyed out" and "unreadable".
disabled_colors=#938f99, #211f24, #2b292f, #36343a, #141318, #48454e, #938f99, #322f35, #938f99, #141318, #141318, #000000, #36343a, #938f99, #938f99, #938f99, #1c1b20, #211f24, #e6e1e9, #322f35, #938f99
; Inactive (window not focused): only the selection is muted, so an unfocused dialog still reads.
inactive_colors=#e6e1e9, #211f24, #2b292f, #36343a, #141318, #48454e, #e6e1e9, #322f35, #e6e1e9, #141318, #141318, #000000, #4c3e76, #e8ddff, #cebdfe, #efb8c9, #1c1b20, #211f24, #e6e1e9, #322f35, #938f99

[ColorEffects:Disabled]
Color=rgb(147, 143, 153)
ColorAmount=0
ColorEffect=0
ContrastAmount=0.65
ContrastEffect=1
IntensityAmount=0.1
IntensityEffect=2

[ColorEffects:Inactive]
ChangeSelectionColor=true
Color=rgb(72, 69, 78)
ColorAmount=0.025
ColorEffect=2
ContrastAmount=0.1
ContrastEffect=0
Enable=true
IntensityAmount=0
IntensityEffect=0
